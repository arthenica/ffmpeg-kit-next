# Manually started build of tvos.sh.
#
# A single architecture is built per job. Compiling every architecture of a
# platform in one job overruns the six hour GitHub Actions job limit, so the job
# pins the tvOS device architecture with --arch=arm64 and still exercises the
# xcframework packaging path with --xcframework.
#
# Host packages come from the tvOS Prerequisites wiki page ("Requirements
# Without Nix"). Xcode and the tvOS SDK come from the runner image; the wiki
# requires Xcode 26.0 or later, which is what the macos-26 image provides.

name: tvos build scripts

on:
  push:
    branches:
      - main
    paths:
      - 'apple/**'
      - 'tvos.sh'
      - 'nix-tvos.sh'
      - 'apple.sh'
      - 'nix-apple.sh'
      - 'scripts/apple/**'
      - 'scripts/function-tvos.sh'
      - 'scripts/function-apple.sh'
      - 'scripts/help-tvos.sh'
      - 'scripts/help-apple.sh'
      - 'scripts/main-tvos.sh'
      - 'scripts/run-apple.sh'
      - 'scripts/function.sh'
      - 'scripts/variable.sh'
      - 'scripts/source.sh'
      - 'tools/**'
      - '.github/workflows/tvos-build-scripts.yml'
  pull_request:
    branches:
      - main
      - development
    paths:
      - 'apple/**'
      - 'tvos.sh'
      - 'nix-tvos.sh'
      - 'apple.sh'
      - 'nix-apple.sh'
      - 'scripts/apple/**'
      - 'scripts/function-tvos.sh'
      - 'scripts/function-apple.sh'
      - 'scripts/help-tvos.sh'
      - 'scripts/help-apple.sh'
      - 'scripts/main-tvos.sh'
      - 'scripts/run-apple.sh'
      - 'scripts/function.sh'
      - 'scripts/variable.sh'
      - 'scripts/source.sh'
      - 'tools/**'
      - '.github/workflows/tvos-build-scripts.yml'
  workflow_dispatch:
    inputs:
      extra-options:
        description: 'extra options appended to the tvos.sh command line'
        required: false
        default: ''

jobs:
  build-on-macos-26-arm64:
    name: tvos arm64 on macos-26
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: prerequisites
        run: |
          brew install autoconf automake libtool pkg-config gettext \
            cmake bison meson ninja nasm yasm gperf ragel texinfo autogen \
            gtk-doc libtasn1 doxygen wget gnu-sed xz
      - name: configure host tool paths
        run: |
          {
            echo "$(brew --prefix gettext)/bin"
            echo "$(brew --prefix bison)/bin"
            echo "$(brew --prefix texinfo)/bin"
          } >> "$GITHUB_PATH"
          {
            echo "ACLOCAL_PATH=$(brew --prefix gettext)/share/aclocal:$(brew --prefix)/share/aclocal"
            echo "SED=$(brew --prefix gnu-sed)/bin/gsed"
          } >> "$GITHUB_ENV"
      - name: print the selected xcode
        run: xcodebuild -version
      - name: run the build script
        env:
          EXTRA_OPTIONS: ${{ inputs.extra-options }}
        run: ./tvos.sh --arch=arm64 --xcframework --enable-lib-all --enable-gpl --disable-lib-gnutls ${EXTRA_OPTIONS}
      - name: print build logs
        if: ${{ always() }}
        run: cat build.log
      - name: print ffbuild logs
        if: ${{ failure() }}
        run: '[[ -f ./src/ffmpeg/ffbuild/config.log ]] && tail -50 ./src/ffmpeg/ffbuild/config.log'
