# Manually started build of web.sh.
#
# A single architecture is built per job. Compiling every architecture of a
# platform in one job overruns the six hour GitHub Actions job limit, so each
# job pins wasm32 with --arch. wasm32-unknown-emscripten is the target web.sh
# derives from that architecture.
#
# Host packages come from the Web Prerequisites wiki page ("Requirements Without
# Nix"). Emscripten is installed through emsdk, which also supplies the node
# build emcc runs on.

name: web build scripts

on:
  # TEMPORARY - REMOVE BEFORE MERGING TO main.
  # workflow_dispatch only becomes available once the file is on the default
  # branch, so this lets the workflow be exercised from development-github-actions
  # first. The path filter is this file alone, so pushing one workflow does not
  # start the other seven.
  push:
    branches: [ development-github-actions ]
    paths:
      - '.github/workflows/web-build-scripts.yml'
  workflow_dispatch:
    inputs:
      emscripten-version:
        description: 'emsdk version to install and activate'
        required: false
        default: 'latest'
      extra-options:
        description: 'extra options appended to the web.sh command line'
        required: false
        default: ''

jobs:
  build-on-ubuntu-2404-wasm32:
    name: web wasm32 on ubuntu-24.04
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config gettext autopoint \
            cmake bison meson ninja-build texinfo \
            make patch file findutils gawk rsync \
            python3 perl ruby curl wget git zip unzip xz-utils tar gzip sed grep diffutils
      - name: set up emscripten
        env:
          EMSCRIPTEN_VERSION: ${{ inputs.emscripten-version }}
        run: |
          set -e
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          cd "$HOME/emsdk"
          ./emsdk install "${EMSCRIPTEN_VERSION:-latest}"
          ./emsdk activate "${EMSCRIPTEN_VERSION:-latest}"
          . ./emsdk_env.sh >/dev/null 2>&1
          {
            echo "EMSDK=${EMSDK}"
            echo "EMSDK_NODE=${EMSDK_NODE}"
            echo "EM_CONFIG=${EM_CONFIG}"
            echo "EM_CACHE=${GITHUB_WORKSPACE}/.tmp/emscripten-cache"
          } >> "$GITHUB_ENV"
          {
            echo "${EMSDK}/upstream/emscripten"
            dirname "${EMSDK_NODE}"
          } >> "$GITHUB_PATH"
      - name: print the emscripten version
        run: emcc --version
      - name: run the build script
        env:
          EXTRA_OPTIONS: ${{ inputs.extra-options }}
        run: ./web.sh --arch=wasm32 --enable-lib-all --enable-gpl --disable-lib-gnutls ${EXTRA_OPTIONS}
      - name: print build logs
        if: ${{ always() }}
        run: cat build.log
      - name: print ffbuild logs
        if: ${{ failure() }}
        run: '[[ -f ./src/ffmpeg/ffbuild/config.log ]] && tail -50 ./src/ffmpeg/ffbuild/config.log'

  build-on-macos-26-wasm32:
    name: web wasm32 on macos-26
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: prerequisites
        run: |
          brew install autoconf automake libtool pkg-config gettext \
            cmake bison meson ninja texinfo wget
      - name: configure host tool paths
        run: |
          {
            echo "$(brew --prefix gettext)/bin"
            echo "$(brew --prefix bison)/bin"
            echo "$(brew --prefix texinfo)/bin"
          } >> "$GITHUB_PATH"
          echo "ACLOCAL_PATH=$(brew --prefix gettext)/share/aclocal:$(brew --prefix)/share/aclocal" >> "$GITHUB_ENV"
      - name: set up emscripten
        env:
          EMSCRIPTEN_VERSION: ${{ inputs.emscripten-version }}
        run: |
          set -e
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          cd "$HOME/emsdk"
          ./emsdk install "${EMSCRIPTEN_VERSION:-latest}"
          ./emsdk activate "${EMSCRIPTEN_VERSION:-latest}"
          . ./emsdk_env.sh >/dev/null 2>&1
          {
            echo "EMSDK=${EMSDK}"
            echo "EMSDK_NODE=${EMSDK_NODE}"
            echo "EM_CONFIG=${EM_CONFIG}"
            echo "EM_CACHE=${GITHUB_WORKSPACE}/.tmp/emscripten-cache"
          } >> "$GITHUB_ENV"
          {
            echo "${EMSDK}/upstream/emscripten"
            dirname "${EMSDK_NODE}"
          } >> "$GITHUB_PATH"
      - name: print the emscripten version
        run: emcc --version
      - name: run the build script
        env:
          EXTRA_OPTIONS: ${{ inputs.extra-options }}
        run: ./web.sh --arch=wasm32 --enable-lib-all --enable-gpl --disable-lib-gnutls ${EXTRA_OPTIONS}
      - name: print build logs
        if: ${{ always() }}
        run: cat build.log
      - name: print ffbuild logs
        if: ${{ failure() }}
        run: '[[ -f ./src/ffmpeg/ffbuild/config.log ]] && tail -50 ./src/ffmpeg/ffbuild/config.log'
