# Manually started build of macos.sh.
#
# A single architecture is built per job. Compiling every architecture of a
# platform in one job overruns the six hour GitHub Actions job limit, so the job
# pins the runner's native architecture with --arch=arm64 and still exercises the
# xcframework packaging path with --xcframework.
#
# Host packages come from the macOS Prerequisites wiki page ("Requirements
# Without Nix"). Xcode and the macOS SDK come from the runner image; the wiki
# requires Xcode 26.0 or later, which is what the macos-26 image provides.

name: macos build scripts

on:
  # TEMPORARY - REMOVE BEFORE MERGING TO main.
  # workflow_dispatch only becomes available once the file is on the default
  # branch, so this lets the workflow be exercised from development-github-actions
  # first. The path filter is this file alone, so pushing one workflow does not
  # start the other seven.
  push:
    branches: [ development-github-actions ]
    paths:
      - '.github/workflows/macos-build-scripts.yml'
  workflow_dispatch:
    inputs:
      extra-options:
        description: 'extra options appended to the macos.sh command line'
        required: false
        default: ''

jobs:
  build-on-macos-26-arm64:
    name: macos arm64 on macos-26
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: prerequisites
        run: |
          brew install autoconf automake libtool pkg-config gettext \
            cmake bison meson ninja nasm yasm gperf ragel texinfo autogen \
            gtk-doc libtasn1 doxygen wget
      - name: configure host tool paths
        run: |
          {
            echo "$(brew --prefix gettext)/bin"
            echo "$(brew --prefix bison)/bin"
            echo "$(brew --prefix texinfo)/bin"
          } >> "$GITHUB_PATH"
          echo "ACLOCAL_PATH=$(brew --prefix gettext)/share/aclocal:$(brew --prefix)/share/aclocal" >> "$GITHUB_ENV"
      - name: print the selected xcode
        run: xcodebuild -version
      - name: run the build script
        env:
          EXTRA_OPTIONS: ${{ inputs.extra-options }}
        run: ./macos.sh --arch=arm64 --xcframework --enable-lib-all --enable-gpl --disable-lib-gnutls ${EXTRA_OPTIONS}
      - name: print build logs
        if: ${{ always() }}
        run: cat build.log
      - name: print ffbuild logs
        if: ${{ failure() }}
        run: '[[ -f ./src/ffmpeg/ffbuild/config.log ]] && tail -50 ./src/ffmpeg/ffbuild/config.log'
