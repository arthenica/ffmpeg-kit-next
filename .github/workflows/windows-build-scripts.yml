# Manually started build of windows.sh.
#
# A single architecture is built per job. Compiling every architecture of a
# platform in one job overruns the six hour GitHub Actions job limit, so each
# job pins its architecture with --arch. windows.sh compiles natively, so each
# architecture needs a runner image of the same architecture and the matching
# MSYS2 environment: x86-64 runs in CLANG64 on the x64 runner image, which
# provides the x86_64-w64-mingw32-clang toolchain, and arm64 runs in
# CLANGARM64 on the arm64 runner image, which provides the
# aarch64-w64-mingw32-clang toolchain.
#
# Nix has no native Windows toolchain, so there is no nix-windows.sh: the
# compiler and host tools come from MSYS2. Packages come from the Windows
# Prerequisites wiki page. The ${MINGW_PACKAGE_PREFIX}- builds of cmake, meson
# and ninja are installed through pacboy's :p suffix so they target Windows
# natively; the remaining tools only run on the build machine, so their plain
# MSYS2 packages are used. nasm is only installed for x86-64, where FFmpeg and
# the external libraries assemble their x86 optimizations with it; arm64
# assembly is handled by clang.

name: windows build scripts

on:
  push:
    branches:
      - main
    paths:
      - 'windows/**'
      - 'windows.sh'
      - 'scripts/windows/**'
      - 'scripts/function-windows.sh'
      - 'scripts/help-windows.sh'
      - 'scripts/main-windows.sh'
      - 'scripts/run-windows.sh'
      - 'scripts/function.sh'
      - 'scripts/variable.sh'
      - 'scripts/source.sh'
      - 'tools/**'
      - '.github/workflows/windows-build-scripts.yml'
  pull_request:
    branches:
      - main
      - development
    paths:
      - 'windows/**'
      - 'windows.sh'
      - 'scripts/windows/**'
      - 'scripts/function-windows.sh'
      - 'scripts/help-windows.sh'
      - 'scripts/main-windows.sh'
      - 'scripts/run-windows.sh'
      - 'scripts/function.sh'
      - 'scripts/variable.sh'
      - 'scripts/source.sh'
      - 'tools/**'
      - '.github/workflows/windows-build-scripts.yml'
  workflow_dispatch:
    inputs:
      extra-options:
        description: 'extra options appended to the windows.sh command line'
        required: false
        default: ''

jobs:
  build-on-windows-2025-x86-64:
    name: windows x86-64 on windows-2025
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: set up msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            make autoconf-wrapper automake-wrapper libtool patch diffutils
            git curl wget rsync pkgconf zip unzip tar xz gzip
            gperf bison gettext-devel texinfo autogen python perl ruby
          pacboy: >-
            clang:p lld:p llvm:p pkgconf:p cmake:p meson:p ninja:p nasm:p
      - name: print the selected toolchain
        run: |
          echo "MSYSTEM=${MSYSTEM}"
          echo "MINGW_PACKAGE_PREFIX=${MINGW_PACKAGE_PREFIX}"
          clang --version
          nasm --version
      - name: run the build script
        env:
          EXTRA_OPTIONS: ${{ inputs.extra-options }}
        run: ./windows.sh --arch=x86-64 --enable-lib-all --enable-gpl --disable-lib-gnutls ${EXTRA_OPTIONS}
      - name: print build logs
        if: ${{ always() }}
        run: cat build.log
      - name: print ffbuild logs
        if: ${{ failure() }}
        run: '[[ -f ./src/ffmpeg/ffbuild/config.log ]] && tail -50 ./src/ffmpeg/ffbuild/config.log'

  build-on-windows-11-arm-arm64:
    name: windows arm64 on windows-11-arm
    runs-on: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: set up msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            make autoconf-wrapper automake-wrapper libtool patch diffutils
            git curl wget rsync pkgconf zip unzip tar xz gzip
            gperf bison gettext-devel texinfo autogen python perl ruby
          pacboy: >-
            clang:p lld:p llvm:p pkgconf:p cmake:p meson:p ninja:p
      - name: print the selected toolchain
        run: |
          echo "MSYSTEM=${MSYSTEM}"
          echo "MINGW_PACKAGE_PREFIX=${MINGW_PACKAGE_PREFIX}"
          clang --version
      - name: run the build script
        env:
          EXTRA_OPTIONS: ${{ inputs.extra-options }}
        run: ./windows.sh --arch=arm64 --enable-lib-all --enable-gpl --disable-lib-gnutls ${EXTRA_OPTIONS}
      - name: print build logs
        if: ${{ always() }}
        run: cat build.log
      - name: print ffbuild logs
        if: ${{ failure() }}
        run: '[[ -f ./src/ffmpeg/ffbuild/config.log ]] && tail -50 ./src/ffmpeg/ffbuild/config.log'
