## -*- mode: perl; -*-
#
# MinGW-w64 aarch64 (Windows on Arm) target for FFmpegKitNext.
#
# OpenSSL ships "mingw" (x86) and "mingw64" (x86_64) but has no aarch64 MinGW
# target, so define one here and load it through Configure's --config option.
#
# This mirrors "mingw64" from Configurations/10-main.conf with the x86 specifics
# replaced by their aarch64 equivalents:
#
#   - no "-m64": that is an x86 option and aarch64 compilers reject it
#   - asm_arch selects the aarch64 assembly sources
#   - perlasm_scheme "win64" emits GNU assembler syntax with PE/COFF directives
#     (.def/.type/.endef), which is the combination the upstream
#     VC-WIN64-CLANGASM-ARM target uses to assemble aarch64 Windows objects with
#     clang. It is NOT the MSVC armasm64 syntax.
#   - bn_ops uses SIXTY_FOUR_BIT rather than SIXTY_FOUR_BIT_LONG because Windows
#     is LLP64, so "long" stays 32-bit
#   - uplink (applink) is left off, exactly as "mingw64" does
#
# If the assembler ever rejects the generated aarch64 sources, adding "no-asm"
# to the Configure call in scripts/windows/openssl.sh falls back to the portable
# C implementations.

my %targets = (
    "mingw64-aarch64" => {
        inherit_from     => [ "mingw-common" ],
        sys_id           => "MINGW64",
        bn_ops           => add("SIXTY_FOUR_BIT"),
        asm_arch         => 'aarch64',
        uplink_arch      => undef,
        perlasm_scheme   => "win64",
        multilib         => "",
    },
);
